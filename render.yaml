services:
  - type: web
    name: digisafe-app
    env: python
    buildCommand: pip install -r requirements.txt && python seed_data.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DIGISAFE_AES_KEY
        value: DigiSafeSecretEncryptionKey2026!
