services:
  - type: web
    name: digisafe-knust
    runtime: python
    plan: free
    region: frankfurt

    # Install only - the trained models are committed and loaded as-is.
    #
    # An earlier version retrained the classifier here so the pickle would match
    # the installed scikit-learn. requirements.txt now pins those versions
    # exactly, which gives the same guarantee without fitting a model on a
    # 512 MB free instance, where training risks an out-of-memory build failure.
    # It also cuts the build from minutes to seconds.
    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Signs the JWTs. Render generates a strong random value on first deploy
      # and keeps it stable afterwards.
      - key: SECRET_KEY
        generateValue: true

      # AES-256 key for evidence-at-rest encryption. Deliberately NOT committed:
      # set it once in the Render dashboard (Environment tab).
      #
      # It must stay CONSTANT across deploys - rotating it makes every evidence
      # record already in the database undecryptable, which for this system means
      # permanently destroying a victim's evidence. Use exactly 32 characters.
      #
      # If unset, core/config.py falls back to a built-in development key, so the
      # demo still runs; that fallback is NOT safe for real victim data.
      - key: DIGISAFE_AES_KEY
        sync: false

      # --- Email verification (see EMAIL_SETUP.md) ---
      #
      # All sync: false, so Render prompts for each value in the dashboard and
      # none of them are ever written into this repository. Leave them unset and
      # the platform still runs: verification codes are printed to the service
      # log instead of being emailed, which is enough to demonstrate the flow
      # but not enough for real users, who cannot read your logs.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: DigiSafe

      # Pin the public address once the service has a stable URL, e.g.
      # https://digisafe-knust.onrender.com. Pinning it also means a forged Host
      # header cannot put another domain into a verification link.
      - key: APP_BASE_URL
        sync: false
